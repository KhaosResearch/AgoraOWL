name: Deploy Ontology to GitHub Pages

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Version to (re)publish, e.g. 1.3.0 - for republishing an
          already-released version in place (docs/content fix, no version
          bump), without cutting a new release. Leave empty to publish
          whatever the dispatched ref's tag name resolves to.
        required: false
        type: string

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Tag Versions
        id: get_version
        shell: bash
        run: |
          INPUT_VERSION="${{ github.event.inputs.version }}"
          if [ -n "$INPUT_VERSION" ]; then
            VERSION_NO_V="${INPUT_VERSION#v}"
            echo "VERSION_TAG_V=v${VERSION_NO_V}" >> $GITHUB_OUTPUT
            echo "VERSION_NO_V=${VERSION_NO_V}" >> $GITHUB_OUTPUT
          else
            TAG_CON_V=${{ github.ref_name }}
            echo "VERSION_TAG_V=$TAG_CON_V" >> $GITHUB_OUTPUT
            echo "VERSION_NO_V=${TAG_CON_V#v}" >> $GITHUB_OUTPUT
          fi

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install --quiet rdflib

      - name: Download Widoco
        run: wget -O widoco.jar https://github.com/dgarijo/Widoco/releases/download/v1.4.25/widoco-1.4.25-jar-with-dependencies_JDK-17.jar

      - name: Post-process RDF source files
        shell: bash
        run: |
          set -euo pipefail
          V="${{ steps.get_version.outputs.VERSION_NO_V }}"
          if [ ! -d "src/$V" ]; then
            echo "ERROR: release $V has no matching src/$V directory. Create the versioned ontology before publishing the release."
            exit 1
          fi
          echo "Updating version references to $V in TTL files..."
          # Find all TTL files in the versioned source directory
          find src/$V -name "*.ttl" -type f | while read f; do
            # 1. Update versioned URIs in prefixes and deep links
            sed -i -E "s|https://w3id.org/AgoraOWL/[0-9]+\.[0-9]+\.[0-9]+/|https://w3id.org/AgoraOWL/${V}/|g" "$f"
            
            # 2. Update owl:versionInfo (flexible whitespace)
            sed -i -E "s/owl:versionInfo[[:space:]]+\"[0-9]+\.[0-9]+\.[0-9]+\"/owl:versionInfo \"${V}\"/g" "$f"
            
            # 3. Update owl:versionIRI (flexible whitespace, no trailing slash)
            sed -i -E "s|owl:versionIRI[[:space:]]+<https://w3id.org/AgoraOWL/[0-9]+\.[0-9]+\.[0-9]+>|owl:versionIRI <https://w3id.org/AgoraOWL/${V}>|g" "$f"
            
            # 4. Update bibliographic citations and general "Version X.Y.Z" mentions
            sed -i -E "s/Version [0-9]+\.[0-9]+\.[0-9]+/Version ${V}/g" "$f"
            
            # 5. Update "AgoraOWL vX.Y.Z" occurrences
            sed -i -E "s/AgoraOWL v[0-9]+\.[0-9]+\.[0-9]+/AgoraOWL v${V}/g" "$f"
          done

      - name: Generate documentation with Widoco
        shell: bash
        run: |
          TAG_NO_V=${{ steps.get_version.outputs.VERSION_NO_V }}
          echo "Generating documentation for version $TAG_NO_V"

          VOCAB_IMPORTS=""
          VOCAB_FILES=$(ls src/$TAG_NO_V/vocabularies/*.ttl 2>/dev/null || true)
          if [ -n "$VOCAB_FILES" ]; then
            for F in $VOCAB_FILES; do
              VOCAB_IMPORTS="$VOCAB_IMPORTS -import ./vocabularies/$(basename $F)"
            done
            echo "Found vocabs: $VOCAB_IMPORTS"
          else
            echo "--- No vocabularies found in src/$TAG_NO_V/vocabularies/ ---"
          fi

          echo "--- Running Widoco ---"
          java -jar ../../widoco.jar \
            -ontFile AgoraOWL.ttl \
            -outFolder /home/runner/work/AgoraOWL/AgoraOWL/build/docs \
            -oops \
            -lang en-es \
            -webVowl \
            -rewriteAll \
            -htaccess \
            -uniteSections \
            -includeAnnotationProperties \
            $VOCAB_IMPORTS
        working-directory: ./src/${{ steps.get_version.outputs.VERSION_NO_V }}

      - name: Post-process Widoco HTML
        shell: bash
        run: |
          set -euo pipefail
          V="${{ steps.get_version.outputs.VERSION_NO_V }}"
          shopt -s nullglob
          for f in build/docs/doc/*.html build/docs/doc/*/*.html; do
            sed -i -E "s|(href=\")https://w3id.org/AgoraOWL(/([0-9]+\.[0-9]+\.[0-9]+))?/vocabularies/([A-Za-z0-9._-]+)\"|\\1https://w3id.org/AgoraOWL/${V}/vocabularies/\\4\"|g" "$f"
          done

      - name: Generate vocabulary documentation
        shell: bash
        run: |
          set -euo pipefail
          V="${{ steps.get_version.outputs.VERSION_NO_V }}"
          # A fragment such as .../vocabularies/observed-properties#ndvi is never
          # sent to the server, so a redirect cannot resolve it. These pages carry
          # one anchor per concept (or a sharded lookup for SIEX's 82k concepts).
          python3 scripts/generate_vocab_docs.py --version "$V" --out build/vocab-docs

      - name: Prepare files for deployment
        id: prep
        shell: bash
        run: |
          set -euo pipefail
          DEST_VERSION=${{ steps.get_version.outputs.VERSION_NO_V }}

          echo "Preparing files for deploy folder $DEST_VERSION"
          mkdir -p deploy/$DEST_VERSION

          echo "Copying Widoco documentation files..."
          cp -r build/docs/doc/* deploy/$DEST_VERSION/

          echo "Copying RDF serialization files (ontology.*)..."
          find build/docs -maxdepth 1 -type f -exec cp -t deploy/$DEST_VERSION/ {} +

          echo "Copying source AgoraOWL.ttl..."
          if [ -f "src/$DEST_VERSION/AgoraOWL.ttl" ]; then
            cp -f "src/$DEST_VERSION/AgoraOWL.ttl" "deploy/$DEST_VERSION/AgoraOWL.ttl"
          fi

          # v1.3.0: the optional third-party alignment module and the JSON-LD
          # context are first-class published artefacts. The context in
          # particular is what Eclipse EDC 0.18+ fetches when a dataspace
          # registers AgoraOWL via edc.dataspace.profiles.*.jsonld.context.urls,
          # so it MUST be reachable at https://w3id.org/AgoraOWL/context.jsonld.
          for artefact in alignment.ttl context.jsonld; do
            if [ -f "src/$DEST_VERSION/$artefact" ]; then
              echo "Copying $artefact..."
              cp -f "src/$DEST_VERSION/$artefact" "deploy/$DEST_VERSION/$artefact"
            fi
          done

          echo "Copying vocabularies..."
          mkdir -p deploy/$DEST_VERSION/vocabularies
          if [ -n "$(ls src/$DEST_VERSION/vocabularies/*.ttl 2>/dev/null)" ]; then
            cp src/$DEST_VERSION/vocabularies/*.ttl deploy/$DEST_VERSION/vocabularies/
          fi

          echo "Copying generated vocabulary documentation..."
          if [ -d build/vocab-docs ]; then
            cp -r build/vocab-docs/. "deploy/$DEST_VERSION/vocabularies/"
          fi

          echo "Copying shapes..."
          mkdir -p deploy/$DEST_VERSION/shapes
          if [ -d "src/$DEST_VERSION/shapes" ]; then
            cp -r "src/$DEST_VERSION/shapes/." "deploy/$DEST_VERSION/shapes/"
          fi

          echo "Copying examples..."
          mkdir -p deploy/$DEST_VERSION/examples
          if [ -d "src/$DEST_VERSION/examples" ]; then
            cp -r "src/$DEST_VERSION/examples/." "deploy/$DEST_VERSION/examples/"
          fi

          echo "Copying versioned README.md..."
          if [ -f "src/$DEST_VERSION/README.md" ]; then
            cp "src/$DEST_VERSION/README.md" "deploy/$DEST_VERSION/README.md"
          fi

          echo "Copying versioned index.html..."
          if [ -f "src/$DEST_VERSION/index.html" ]; then
            cp "src/$DEST_VERSION/index.html" "deploy/$DEST_VERSION/index.html"
          fi

          echo "Copying root index.html..."
          if [ -f "src/index.html" ]; then
            cp "src/index.html" "deploy/index.html"
          else
            echo "--- WARN: src/index.html not found. Landing page will be missing. ---"
          fi

          echo "Copying assets (CSS and JS)..."
          if [ -d "src/assets" ]; then
            cp -r "src/assets" "deploy/assets"
            echo "Assets copied successfully"
          fi

          echo "Copying images..."
          if [ -d "images" ]; then
            cp -r "images" "deploy/images"
            echo "Images copied successfully"
          fi

          echo "Copying global documentation..."
          if [ -d "docs" ]; then
            cp -r "docs" "deploy/docs"
            echo "Docs copied successfully"
          fi

          echo "Syncing 'latest'..."
          rm -rf deploy/latest
          cp -r deploy/$DEST_VERSION deploy/latest

          echo "Disabling Jekyll..."
          touch deploy/.nojekyll

          echo "DEPLOY_ROOT=deploy" >> $GITHUB_OUTPUT

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ steps.prep.outputs.DEPLOY_ROOT }}
          publish_branch: gh-pages
          keep_files: true
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "Deploy: Deploy ${{ steps.get_version.outputs.VERSION_TAG_V }} to gh-pages"
